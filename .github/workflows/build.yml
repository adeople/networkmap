name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build single-file exe
        run: python build_exe.py

      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/networkmap.exe")) { throw "dist/networkmap.exe not found" }
          $size = [math]::Round((Get-Item "dist/networkmap.exe").Length / 1MB, 1)
          Write-Host "networkmap.exe = $size MB"

      - name: Smoke test (start and query API)
        shell: pwsh
        run: |
          Start-Process -FilePath "dist/networkmap.exe" -ArgumentList "--no-open", "--port", "8899"
          try {
            $ok = $false
            for ($i = 1; $i -le 6; $i++) {
              Start-Sleep -Seconds 6
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:8899/api/state" -UseBasicParsing -TimeoutSec 40
                $j = $r.Content | ConvertFrom-Json
                if ($r.StatusCode -eq 200 -and $j.ok) { $ok = $true; break }
              }
              catch {
                Write-Host "attempt $i failed: $($_.Exception.Message)"
              }
            }
            if (-not $ok) { throw "API did not become ready in time" }
            Write-Host "smoke test passed; nmap available = $($j.nmap.available)"
          }
          finally {
            taskkill /IM networkmap.exe /F 2>$null
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: networkmap-windows-x64
          path: dist/networkmap.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: networkmap-windows-x64
          path: dist

      - name: Rename asset
        run: mv dist/networkmap.exe "dist/networkmap-${GITHUB_REF_NAME}.exe"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$REPO" \
              --title "networkmap ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "dist/networkmap-${GITHUB_REF_NAME}.exe" --repo "$REPO" --clobber
          gh release view "$GITHUB_REF_NAME" --repo "$REPO" --json assets --jq '.assets[] | .name'
